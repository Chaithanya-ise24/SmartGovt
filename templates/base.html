<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>SmartGov School</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-50 min-h-screen">
  <nav class="bg-sky-600 text-white p-4 flex justify-between items-center">
    <span class="font-bold text-lg">🏫 SmartGov School – GHPS Varthur</span>
    {% if g.user %}
      <span>{{ g.user.name }} ({{ g.user.role }}) · <a class="underline" href="{{ url_for('auth.logout') }}">Logout</a></span>
    {% endif %}
  </nav>
  <main class="{% block main_class %}max-w-md{% endblock %} mx-auto p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="mb-3 p-3 rounded {{ 'bg-red-100 text-red-700' if cat=='error' else 'bg-green-100 text-green-700' }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
