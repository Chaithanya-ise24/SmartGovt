{% extends "base.html" %}
{% block main_class %}max-w-4xl{% endblock %}
{% block content %}
<div class="mt-6">
  <div class="bg-gradient-to-r from-purple-600 to-sky-600 text-white rounded-2xl p-6 shadow">
    <h1 class="text-3xl font-bold">🚧 Coming Soon</h1>
    <p class="mt-2 text-purple-100">New features we are building for GHPS Varthur.</p>
  </div>

  <div class="grid sm:grid-cols-2 gap-4 mt-6">
    {% for i in items %}
    <div class="bg-white rounded-xl shadow p-5 border border-dashed border-purple-300">
      <div class="flex items-center justify-between">
        <span class="text-3xl">{{ i.icon }}</span>
        <span class="text-xs font-semibold bg-amber-100 text-amber-800 px-2 py-1 rounded-full">Coming soon</span>
      </div>
      <h2 class="font-bold text-lg text-gray-800 mt-3">{{ i.title }}</h2>
      <p class="text-sm text-gray-600 mt-1">{{ i.desc }}</p>
      <button disabled class="mt-4 w-full bg-gray-200 text-gray-500 py-2 rounded-lg cursor-not-allowed">Not available yet</button>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
