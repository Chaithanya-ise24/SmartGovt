{% extends "base.html" %}
{% block content %}
<div class="bg-white rounded-xl shadow p-6 mt-6">
  <h1 class="text-xl font-bold">{{ title }}</h1>
  {% if g.user and g.user.role == 'admin' and 'Denied' not in title %}
    <a href="{{ url_for('admin_users') }}" class="inline-block mt-4 bg-sky-600 text-white px-4 py-2 rounded">👤 Manage Users</a>
  {% elif 'Denied' in title %}
    <p class="text-gray-600 mt-2">You don't have permission to open this page.</p>
  {% else %}
    <p class="text-gray-600 mt-2">Features coming soon.</p>
  {% endif %}
</div>
{% endblock %}
