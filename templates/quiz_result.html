
{% extends "base.html" %}

{% block main_class %}max-w-3xl{% endblock %}

{% block content %}

<div class="bg-white rounded-2xl shadow-lg p-8 mt-8 text-center">

    <h1 class="text-3xl font-bold text-sky-700">
        🎉 Quiz Completed!
    </h1>

    <p class="text-gray-600 mt-4 text-lg">
        Great job! Here is your result.
    </p>

    <div class="mt-8">
        <p class="text-gray-500">Your Score</p>

        <h2 class="text-5xl font-bold text-sky-600 mt-2">
            {{ score }} / {{ total }}
        </h2>
    </div>

    <div class="mt-8 bg-yellow-50 rounded-xl p-5">
        <p class="text-2xl">⭐</p>
        <h2 class="text-2xl font-bold text-yellow-600 mt-2">
            +{{ stars_earned }} Stars
        </h2>
        <p class="text-gray-600 mt-1">
            Stars added to your account!
        </p>
    </div>

    <a href="{{ url_for('student.quiz') }}"
       class="inline-block mt-8 bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-3 rounded-xl">
        Try Another Quiz
    </a>

    <br>

    <a href="{{ url_for('auth.student_home') }}"
       class="inline-block mt-4 text-sky-600 font-semibold">
        Back to Dashboard
    </a>

</div>

{% endblock %}
