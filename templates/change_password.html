{% extends "base.html" %}
{% block content %}
<form method="post" class="bg-white rounded-xl shadow p-6 mt-6 space-y-3">
  <h2 class="font-bold text-lg">{{ 'Set a new 4-digit PIN' if g.user.role == 'student' else 'Set a new password' }}</h2>
  <input name="new_secret" type="password" placeholder="New {{ 'PIN' if g.user.role == 'student' else 'password' }}" class="w-full border rounded p-2" required>
  <input name="confirm_secret" type="password" placeholder="Confirm" class="w-full border rounded p-2" required>
  <button class="w-full bg-sky-600 text-white py-2 rounded">Save</button>
</form>
{% endblock %}
